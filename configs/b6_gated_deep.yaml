cycle: B
experiment: B6
revision: 1
description: Evidence-triggered whole-block and SA/FF gated deep models on the B5 ecology.
evidence_sources:
  - artifacts/cycle_b/b4_depth_sweep/summary.json
  - artifacts/cycle_b/b5_task_ecology/summary.json
variants: [gated, sa_ff_gated]
data:
  generation_seed: 2718
  train_families: 240
  val_families: 60
  test_families: 60
  distractor_probability: 0.5
  intents: [maximum, minimum, first, middle, last]
  identifiability_levels: [high]
  max_length: 64
model:
  width: 64
  layers: 16
  heads: 4
  mlp_ratio: 2
  max_length: 64
  dropout: 0.0
  goal_width: 24
training:
  seeds: [11, 22, 33, 44, 55]
  device: auto
  epochs: 24
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  max_grad_norm: 1.0
statistics:
  confidence: 0.95
  bootstrap_samples: 2000
  negligible_utility: 0.002
  meaningful_gate_change: 0.02
  minimum_seed_fraction: 0.8
  final_test_frozen: true
output:
  directory: artifacts/cycle_b/b6_gating
